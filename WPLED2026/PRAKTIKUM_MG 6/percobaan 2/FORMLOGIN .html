<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Login</title>
    <link rel="stylesheet" href="login app.css">
</head>
<body>
    <div class="login-card">
        <h2>Login Sistem</h2>
        <form action="proses_tambah_user_.php" method="POST">
            <div class="input-group">
                <label>Username / NRP</label>
                <input type="text" name="username" placeholder="Masukkan Username/NRP" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit">Masuk</button>
        </form>
    </div>
</body>
</html>
